<script>
'use strict';
const q=id=>document.getElementById(id), svg=(tag,attrs={})=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e};
let rows=[];
function parseCSV(raw){let lines=raw.trim().split(/\r?\n/),fields=lines.shift().split(',');return lines.map(line=>{let values=line.split(',');return Object.fromEntries(fields.map((f,i)=>[f,values[i]??'']))})}
function val(x){return x===''?NaN:Number(x)}
function draw(){
  let list=rows,measure=q('measure').value,start=Math.min(Number(q('start').value),list.length-1),visible=list.slice(start);
  q('startText').textContent=visible[0].month;q('endText').textContent=list.at(-1).month;
  let series=visible.map(r=>({month:r.month,mean:val(r[measure]),low:val(r.p10_sst_c),high:val(r.p90_sst_c),n:val(r.n_valid),total:val(r.n_stations)}));
  let temperature=measure==='mean_sst_c', band=temperature&&series.some(r=>Number.isFinite(r.low)&&Number.isFinite(r.high));
  q('bandLegend').hidden=!band;
  let v=series.flatMap(r=>temperature?[r.mean,r.low,r.high]:[r.mean]).filter(Number.isFinite);
  let plot=q('plot');plot.replaceChildren();q('tip').style.display='none';
  if(!v.length){q('note').textContent='The anomaly requires 1991–2020 reference data. Continue the historical backfill to populate this view.';return}
  let lo=Math.min(...v),hi=Math.max(...v);if(!temperature){lo=Math.min(lo,0);hi=Math.max(hi,0)}let pad=Math.max(.15,(hi-lo)*.12);lo-=pad;hi+=pad;
  const W=800,H=340,L=58,R=16,T=18,B=38,xx=i=>L+(W-L-R)*(series.length===1?.5:i/(series.length-1)),yy=n=>T+(H-T-B)*(hi-n)/(hi-lo);
  for(let j=0;j<5;j++){let y=T+(H-T-B)*j/4,number=hi-(hi-lo)*j/4;plot.append(svg('line',{x1:L,x2:W-R,y1:y,y2:y,class:'grid'}));let t=svg('text',{x:3,y:y+4,class:'axis'});t.textContent=number.toFixed(1)+'°C';plot.append(t)}
  for(let j=0;j<5;j++){let i=Math.round(j*(series.length-1)/4),t=svg('text',{x:xx(i),y:H-9,'text-anchor':'middle',class:'axis'});t.textContent=series[i].month.slice(0,4);plot.append(t)}
  if(!temperature)plot.append(svg('line',{x1:L,x2:W-R,y1:yy(0),y2:yy(0),class:'zero'}));
  if(band){let from=-1;for(let i=0;i<=series.length;i++){let ok=i<series.length&&[series[i].mean,series[i].low,series[i].high].every(Number.isFinite);if(ok&&from<0)from=i;if(!ok&&from>=0){let upper=[],lower=[];for(let k=from;k<i;k++){upper.push(`${xx(k)},${yy(series[k].high)}`);lower.push(`${xx(k)},${yy(series[k].low)}`)}plot.append(svg('path',{d:'M'+upper.join(' L')+' L'+lower.reverse().join(' L')+' Z',class:'band'}));from=-1}}}
  let d='',pen=false;series.forEach((r,i)=>{if(!Number.isFinite(r.mean)){pen=false;return}d+=(pen?'L':'M')+xx(i).toFixed(1)+' '+yy(r.mean).toFixed(1)+' ';pen=true});plot.append(svg('path',{d,class:'mean'}));
  let cursor=svg('line',{x1:0,x2:0,y1:T,y2:H-B,class:'cursor'});plot.append(cursor);
  let zone=svg('rect',{x:L,y:T,width:W-L-R,height:H-T-B,class:'target'});plot.append(zone);
  zone.addEventListener('mousemove',event=>{let box=plot.getBoundingClientRect(),localX=(event.clientX-box.left)/box.width*W,i=Math.max(0,Math.min(series.length-1,Math.round((localX-L)/(W-L-R)*(series.length-1)))),r=series[i];cursor.setAttribute('x1',xx(i));cursor.setAttribute('x2',xx(i));let tip=q('tip');tip.textContent=`${r.month} · ${Number.isFinite(r.mean)?r.mean.toFixed(2)+' °C':'No value'} · ${r.n}/${r.total} valid cells${band&&Number.isFinite(r.low)?` · spread ${r.low.toFixed(2)}–${r.high.toFixed(2)} °C`:''}`;tip.style.display='block';tip.style.left=Math.max(5,Math.min(box.width-tip.offsetWidth-5,event.clientX-box.left+12))+'px';tip.style.top=Math.max(5,event.clientY-box.top-36)+'px'});
  zone.addEventListener('mouseleave',()=>{q('tip').style.display='none';cursor.setAttribute('x1',0);cursor.setAttribute('x2',0)});
  let last=list.at(-1);q('note').innerHTML=`Data through ${last.month} · ${last.n_valid}/${last.n_stations} cells with valid SST · <a href="data/sst_monthly.csv" download>Download monthly data (CSV)</a>${temperature?' · Cell spread reflects spatial variation, not uncertainty.':''}`;
}
function setRows(newRows){
  rows=newRows.filter(r=>r.sanctuary==='FKNMS'&&/^\d{4}-\d{2}$/.test(r.month)).sort((a,b)=>a.month.localeCompare(b.month));
  if(!rows.length)throw Error('No FKNMS monthly records found');
  let anomaly=q('measure').querySelector('[value="anomaly_c"]');
  anomaly.hidden=anomaly.disabled=!rows.some(r=>Number.isFinite(val(r.anomaly_c)));
  q('start').max=Math.max(0,rows.length-12);draw();
}
async function load(){
  // The bundled snapshot works when this file is opened directly, with no local server.
  try{setRows(JSON.parse(q('embedded-data').textContent))}
  catch(error){q('note').className='error';q('note').textContent=`Bundled SST data could not load: ${error.message}`;return}
  // On HTTPS/HTTP hosting, prefer the adjacent published CSV if it is valid.
  if(location.protocol!=='http:'&&location.protocol!=='https:')return;
  try{
    let response=await fetch('data/sst_monthly.csv',{cache:'no-cache'});
    if(!response.ok)throw Error('Monthly CSV unavailable');
    let current=parseCSV(await response.text());
    if(!current.some(r=>r.sanctuary==='FKNMS'&&/^\d{4}-\d{2}$/.test(r.month)))throw Error('No FKNMS monthly records found');
    setRows(current);
  }catch(error){q('note').append(` · Using bundled snapshot; hosted CSV unavailable (${error.message}).`)}
}
q('measure').addEventListener('change',draw);q('start').addEventListener('input',draw);load();
</script>
