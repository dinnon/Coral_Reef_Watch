name: Update sanctuary SST
on:
  workflow_dispatch:
  schedule:
    # Monthly composites may arrive after month end; recheck twice monthly.
    - cron: '21 7 5,20 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve NOAA data and rebuild CSV
        run: python update_sst.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update NOAA sanctuary SST CSV'
            git push
          fi
